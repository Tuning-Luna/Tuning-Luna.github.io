<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tuning-Luna's personal homepage — CS student at HFUT. Bio, tech stack, open-source projects and GitHub activity."
    />
    <meta name="theme-color" content="#10140f" />
    <title>Tuning-Luna · Personal Homepage</title>
    <script>
      // Apply the saved (or default dark / English) preferences before first
      // paint so the page never flashes light/Chinese — regardless of the
      // visitor's OS or browser language.
      (function () {
        try {
          var theme = localStorage.getItem('tuning-luna-theme')
          if (theme !== 'light' && theme !== 'dark' && theme !== 'system') theme = 'dark'
          if (theme !== 'system') document.documentElement.setAttribute('data-theme', theme)
          var lang = localStorage.getItem('tuning-luna-lang')
          document.documentElement.lang = lang === 'zh' ? 'zh' : 'en'
        } catch (err) {
          /* ignore storage errors (e.g. private mode) */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
