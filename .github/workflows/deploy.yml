# Deploys the built site to GitHub Pages.
#
# This repository is named `<username>.github.io`, so GitHub Pages serves it as a
# *user site* from the root URL — `vite.config.ts` sets `base: '/'` accordingly.
#
# Follows the official Vite deployment guide (https://vite.dev/guide/static-deploy)
# and the GitHub Pages Actions (configure-pages / upload-pages-artifact / deploy-pages).
#
# EVERY run (push to main, daily schedule, manual dispatch) first refreshes the
# GitHub stats snapshots (src/data/stats.ts + src/data/contributions.ts via
# `npm run stats:fetch`) and commits them back to main when they changed, so
# star/follower/contribution numbers are current on every deploy. Pushes made
# with the workflow's GITHUB_TOKEN never re-trigger workflows, so there is no
# loop.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily at 16:23 UTC = 00:23 Asia/Shanghai (next day). Minute 23 avoids
    # GitHub's top-of-hour cron congestion.
    - cron: '23 16 * * *'
  workflow_dispatch:

# Allow only one concurrent deployment, cancel any run queued while one is running.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write # the scheduled refresh step pushes the stats commit
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regenerate the stats snapshots from the GitHub API and commit them if
      # anything changed — on every trigger (push, schedule, dispatch). The
      # build below uses the refreshed working tree, so the deployed site is
      # current even if the push below is rejected (e.g. a newer commit landed
      # mid-run); the next run re-commits then.
      - name: Refresh stats snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run stats:fetch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- src/data/stats.ts src/data/contributions.ts; then
            echo 'stats snapshots unchanged — nothing to commit'
          else
            git add src/data/stats.ts src/data/contributions.ts
            git commit -m 'chore(data): refresh GitHub stats snapshots [skip ci]'
            git push || echo '::warning::stats commit not pushed (a newer commit likely landed); deploying with the refreshed working tree anyway'
          fi

      - name: Lint & i18n check
        run: npm run lint && npm run check:i18n

      # `npm run build` runs `tsc -b && vite build`, so the TypeScript check
      # happens here as part of the build.
      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
